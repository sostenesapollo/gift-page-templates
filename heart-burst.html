<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Press the heart</title>
<meta name="description" content="A one-file digital gift page: tap the heart until it bursts into a letter.">
<style>
  :root{
    --bg:#0b0410; --ink:#f7ecff; --accent:#ff2e6d; --soft:#b98fd6;
    --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(120% 90% at 50% 0%, #2a0a2e 0%, var(--bg) 60%);
    color:var(--ink); font-family:var(--font);
    display:grid; place-items:center; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #fx{position:fixed;inset:0;pointer-events:none;z-index:3}
  main{width:100%;max-width:34rem;padding:2rem 1.25rem;text-align:center;position:relative;z-index:2}

  /* --- gate --- */
  #gate{display:grid;gap:1.25rem;justify-items:center}
  #heart{
    font-size:6rem; line-height:1; background:none; border:0; cursor:pointer;
    padding:.5rem; filter:drop-shadow(0 0 28px rgba(255,46,109,.55));
    transition:transform .12s cubic-bezier(.34,1.56,.64,1);
    animation:pulse 1.6s ease-in-out infinite;
  }
  #heart:active{transform:scale(.88)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #heart.burst{animation:burst .5s ease-out forwards}
  @keyframes burst{
    0%{transform:scale(1);filter:drop-shadow(0 0 28px rgba(255,46,109,.55))}
    45%{transform:scale(1.9);filter:drop-shadow(0 0 70px rgba(255,46,109,.95))}
    100%{transform:scale(0);opacity:0}
  }
  #hint{color:var(--soft);font-size:.95rem;letter-spacing:.02em;margin:0}
  #dots{display:flex;gap:.4rem}
  #dots i{width:.5rem;height:.5rem;border-radius:50%;background:#3a2244;transition:background .2s,transform .2s}
  #dots i.on{background:var(--accent);transform:scale(1.25)}

  /* --- letter --- */
  #letter{
    animation:rise .6s cubic-bezier(.2,.8,.3,1) both;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.09);
    border-radius:1.25rem; padding:1.75rem 1.5rem; text-align:left;
    backdrop-filter:blur(12px);
  }
  @keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
  #letter h1{font-size:1.6rem;margin:0 0 1rem;line-height:1.25}
  #letter p{line-height:1.65;color:#e6d7f2;margin:0 0 1rem;white-space:pre-wrap}
  #gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin:1rem 0}
  #gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:.75rem}
  #sig{color:var(--soft);font-style:italic;margin-top:1.25rem}
  @media(prefers-reduced-motion:reduce){
    #heart,#heart.burst,#letter{animation:none!important}
  }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main>
  <section id="gate">
    <button id="heart" aria-label="Tap the heart to open your gift">❤️</button>
    <p id="hint">tap it 7 times</p>
    <div id="dots" aria-hidden="true"></div>
  </section>
  <article id="letter" hidden></article>
</main>

<script>
/* ─────────── EDIT ONLY THIS BLOCK ─────────── */
const CONFIG = {
  taps: 7,
  title: "I couldn't wrap this one",
  message: `Every year I buy something and it's fine.\n\nThis year I wanted you to have to work for it a little.\n\nSo: seven taps. That's all it took.`,
  signature: "— happy birthday",
  photos: [
    // "https://example.com/photo-1.jpg",
    // "https://example.com/photo-2.jpg"
  ],
  colors: ["#ff2e6d", "#ff8fb1", "#ffd166", "#a06cd5", "#ffffff"]
};
/* ─────────────────────────────────────────── */

const heart = document.getElementById('heart');
const hint  = document.getElementById('hint');
const dots  = document.getElementById('dots');
const gate  = document.getElementById('gate');
const letter= document.getElementById('letter');
const cvs   = document.getElementById('fx');
const ctx   = cvs.getContext('2d');

let count = 0;
const dotsEls = [];

for (let i = 0; i < CONFIG.taps; i++) {
  const d = document.createElement('i');
  dots.appendChild(d);
  dotsEls.push(d);
}

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width  = innerWidth  * dpr;
  cvs.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', resize);

/* particle system */
let parts = [];
let raf = null;

function spawn(cx, cy, n){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const v = 3 + Math.random() * 9;
    parts.push({
      x: cx, y: cy,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v - 2.5,
      life: 1,
      decay: 0.008 + Math.random() * 0.014,
      size: 2 + Math.random() * 4,
      color: CONFIG.colors[(Math.random() * CONFIG.colors.length) | 0]
    });
  }
}

function tick(){
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.vy += 0.22;
    p.vx *= 0.995;
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0){ parts.splice(i, 1); continue; }
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (parts.length) raf = requestAnimationFrame(tick);
  else { cancelAnimationFrame(raf); raf = null; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}

function spark(ev){
  const r = heart.getBoundingClientRect();
  spawn(r.left + r.width / 2, r.top + r.height / 2, 18);
  if (!raf) raf = requestAnimationFrame(tick);
}

function reveal(){
  const el = letter;
  el.innerHTML = `
    <h1>${escapeHtml(CONFIG.title)}</h1>
    <p>${escapeHtml(CONFIG.message)}</p>
    ${CONFIG.photos.length ? `<div id="gallery">${CONFIG.photos.map(src =>
      `<img src="${escapeAttr(src)}" alt="" loading="lazy">`).join('')}</div>` : ''}
    <p id="sig">${escapeHtml(CONFIG.signature)}</p>
  `;
  gate.hidden = true;
  el.hidden = false;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

heart.addEventListener('click', () => {
  count++;
  spark();
  if (navigator.vibrate) navigator.vibrate(12);

  dotsEls.forEach((d, i) => d.classList.toggle('on', i < count));

  if (count < CONFIG.taps){
    const left = CONFIG.taps - count;
    hint.textContent = left === 1 ? "one more" : `${left} more`;
    heart.style.transform = `scale(${1 + count * 0.02})`;
    return;
  }

  /* final tap */
  heart.classList.add('burst');
  spawn(innerWidth / 2, innerHeight / 2, 260);
  if (!raf) raf = requestAnimationFrame(tick);
  if (navigator.vibrate) navigator.vibrate([30, 40, 60]);
  hint.textContent = "";
  setTimeout(reveal, 480);
});
</script>
</body>
</html>
