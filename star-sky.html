<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A sky full of memories</title>
<meta name="description" content="A one-file digital gift page: a night sky where every star hides a memory.">
<style>
  :root{ --ink:#eaf1ff; --soft:#8ea3c8; --card:#121a2b; --line:rgba(255,255,255,.12); }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#050913;color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden;-webkit-tap-highlight-color:transparent}
  #sky{position:fixed;inset:0;display:block}
  header{position:fixed;top:0;left:0;right:0;padding:1.5rem 1.25rem;text-align:center;z-index:2;pointer-events:none}
  header h1{margin:0;font-size:1.05rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
  header p{margin:.4rem 0 0;font-size:.85rem;color:var(--soft)}
  .star{position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;border:0;padding:0;background:none;
    cursor:pointer;z-index:3;display:grid;place-items:center}
  .star::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;
    box-shadow:0 0 10px 2px rgba(180,210,255,.9),0 0 26px 8px rgba(120,160,255,.28);
    animation:tw 3.4s ease-in-out infinite}
  .star:hover::before,.star:focus-visible::before{width:12px;height:12px}
  .star.done::before{background:#ffd166;box-shadow:0 0 12px 3px rgba(255,209,102,.95),0 0 34px 12px rgba(255,180,60,.3)}
  @keyframes tw{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}

  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 1rem 1.25rem;
    transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.3,1);
    padding-bottom:calc(1.25rem + env(safe-area-inset-bottom))}
  #sheet.open{transform:none}
  #sheet .inner{max-width:30rem;margin:0 auto;background:var(--card);border:1px solid var(--line);
    border-radius:1.25rem;padding:1.5rem 1.4rem}
  #sheet h2{margin:.9rem 0 .6rem;font-size:1.15rem;line-height:1.3}
  #sheet p{margin:0;line-height:1.6;color:#cfdcf2;white-space:pre-wrap;font-size:.95rem}
  #sheet img{width:100%;max-height:46vh;object-fit:cover;border-radius:.9rem;margin-top:.9rem}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;
    transition:opacity .3s;z-index:4}
  #scrim.open{opacity:1;pointer-events:auto}
  #progress{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:3;
    font-size:.78rem;color:var(--soft);letter-spacing:.06em}
  #final{position:fixed;inset:0;z-index:6;background:radial-gradient(circle at 50% 40%,#1a2440,#050913 70%);
    display:grid;place-items:center;padding:2rem;text-align:center;opacity:0;pointer-events:none;transition:opacity .8s}
  #final.show{opacity:1;pointer-events:auto}
  #final h2{font-size:1.5rem;line-height:1.35;max-width:22rem}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<header>
  <h1>a sky full of memories</h1>
  <p>tap a star</p>
</header>
<div id="progress"></div>

<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="inner">
    <div id="sheetMedia"></div>
    <h2 id="sheetTitle"></h2>
    <p id="sheetText"></p>
  </div>
</div>

<div id="final">
  <h2 id="finalText">you found them all.</h2>
</div>

<script>
/* ─────────── EDIT ONLY THIS BLOCK ─────────── */
const MEMORIES = [
  { title: "the first night",   text: "We talked until the café closed and then kept talking in the car.", img: "" },
  { title: "that playlist",     text: "Track 4 is still yours. I skip it when I'm not ready.", img: "" },
  { title: "the wrong train",   text: "We ended up two cities over and it was the best detour of the year.", img: "" },
  { title: "23h47",             text: "You texted me that you couldn't sleep. I was awake too.", img: "" },
  { title: "the photo",         text: "The one where you're not looking at the camera. It's my favorite.", img: "" },
  { title: "one more",          text: "There are more, but they're for later.", img: "" }
];
const FINAL_TEXT = "you found them all.<br><br>there are more where these came from.";
/* ─────────────────────────────────────────── */

const cvs = document.getElementById('sky');
const ctx = cvs.getContext('2d');
const sheet = document.getElementById('sheet');
const scrim = document.getElementById('scrim');
const progress = document.getElementById('progress');
const final = document.getElementById('final');

let W = 0, H = 0, stars = [], found = 0;
const dpr = Math.min(devicePixelRatio || 1, 2);

function resize(){
  W = innerWidth; H = innerHeight;
  cvs.width = W * dpr; cvs.height = H * dpr;
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if (!stars.length) makeStars();
  placeMemoryStars();
}
addEventListener('resize', resize);

function makeStars(){
  const n = Math.round((W * H) / 9000);
  stars = Array.from({ length: n }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.3 + 0.2,
    a: Math.random(),
    sp: Math.random() * 0.012 + 0.003
  }));
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  for (const s of stars){
    s.a += s.sp;
    const o = 0.25 + Math.abs(Math.sin(s.a)) * 0.75;
    ctx.globalAlpha = o;
    ctx.fillStyle = '#dfe9ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}

let starEls = [];
function placeMemoryStars(){
  const padX = 60, padTop = 120, padBottom = 120;
  const cols = W < 480 ? 2 : 3;
  const rows = Math.ceil(MEMORIES.length / cols);
  starEls.forEach(el => el.remove());
  starEls = [];

  MEMORIES.forEach((m, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const cellW = (W - padX * 2) / cols;
    const cellH = (H - padTop - padBottom) / rows;
    const jx = (Math.random() - 0.5) * cellW * 0.35;
    const jy = (Math.random() - 0.5) * cellH * 0.35;
    const x = padX + cellW * col + cellW / 2 + jx;
    const y = padTop + cellH * row + cellH / 2 + jy;

    const b = document.createElement('button');
    b.className = 'star';
    b.style.left = x + 'px';
    b.style.top = y + 'px';
    b.style.animationDelay = (Math.random() * 3) + 's';
    b.setAttribute('aria-label', 'reveal memory');
    b.addEventListener('click', () => openMemory(m, b));
    document.body.appendChild(b);
    starEls.push(b);
  });
}

function openMemory(m, btn){
  document.getElementById('sheetMedia').innerHTML =
    m.img ? `<img src="${m.img}" alt="" loading="lazy">` : '';
  document.getElementById('sheetTitle').textContent = m.title;
  document.getElementById('sheetText').textContent = m.text;
  sheet.classList.add('open');
  scrim.classList.add('open');
  if (!btn.classList.contains('done')){
    btn.classList.add('done');
    found++;
    updateProgress();
  }
}

function updateProgress(){
  progress.textContent = `${found} / ${MEMORIES.length}`;
  if (found === MEMORIES.length){
    setTimeout(() => {
      document.getElementById('finalText').innerHTML = FINAL_TEXT;
      final.classList.add('show');
    }, 600);
  }
}

function closeSheet(){
  sheet.classList.remove('open');
  scrim.classList.remove('open');
}
scrim.addEventListener('click', closeSheet);
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
final.addEventListener('click', () => final.classList.remove('show'));

updateProgress();
resize();
draw();
</script>
</body>
</html>
